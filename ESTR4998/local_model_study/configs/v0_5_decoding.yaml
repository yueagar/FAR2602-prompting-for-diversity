# Protocol v0.5.0, proposed 2026-10-06; agreed by the Professor on 2026-10-09 and run
# from 2026-10-17. The file keeps its original name so existing references hold.
#
# Why (DESIGN.md section 17; review of 5 October 2026): v0.4.0's temperature
# arms keep top-k 20 and top-p 0.8, and transformers applies temperature before
# both, so temp_1.3 still samples among at most 20 tokens. Before the October
# manual study sets "beat temperature" as the bar, test the stronger decoding
# baselines a reviewer will ask about:
#   * untruncated_t1.0: plain temperature-1.0 sampling with no truncation;
#   * minp_0.1_t1.5: min-p sampling (Nguyen et al., ICLR 2025), designed to keep
#     high temperatures coherent. Transformers applies temperature first, then
#     the min-p cut-off, which is the order the paper evaluates; the paper
#     recommends a base of 0.05-0.1 and reports diversity gains at T = 2-3.
#     Artificial Hivemind uses min-p 0.1 at T = 2.0.
#
# Changes from v0.4.0:
#   * the two arms above;
#   * the judge scores one response at a time (DESIGN.md section 16);
#   * RKE is computed at a fixed bandwidth (metrics.rke_score). 0.5 was fixed
#     before any v0.5 run as a round value near half of v0.4.0's median
#     within-set embedding distance (0.837). It was not tuned on these arms.
# Records also carry Vendi scores, deterministic constraint checks and
# probability-weighted judge scores (metric versions in each record).
#
# Kept from v0.4.0: models, prompts, seeds, replicates, reference sets, the
# 512-token ceiling, the rubric and the functional classifier.
# default, temp_1.0 and temp_1.3 use the same seeds, so on the same hardware
# and library versions they should regenerate v0.4.0's samples. That is a
# reproducibility check, not a new result.
# naive_creative is left out: this run compares decoding settings only.

protocol_version: v0.5.0

generator:
  model_id: Qwen/Qwen2.5-1.5B-Instruct
  revision: 989aa7980e4cf806f80c7fef2b1adb7bc71aa306
  dtype: bfloat16

judge:
  model_id: HuggingFaceTB/SmolLM2-1.7B-Instruct
  revision: 31b70e2e869a7173562077fd711b654946d38674
  dtype: bfloat16

embedder:
  model_id: sentence-transformers/all-MiniLM-L6-v2
  revision: 1110a243fdf4706b3f48f1d95db1a4f5529b4d41
  dtype: float32

functional_classifier:
  model_id: yimingzhang/deberta-v3-large-generation-similarity
  revision: 4e11444c12adf9837e58ae1e598472c45b1d3bd9
  dtype: float32
functional_tokenizer:
  model_id: microsoft/deberta-v3-large
  revision: 64a8c8eab3e352a784c658aef62be1662607476f
  dtype: float32

decoding:
  do_sample: true
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  repetition_penalty: 1.1
  eos_token_ids: [151645, 151643]  # <|im_end|>, <|endoftext|>
  max_new_tokens: 512

conditions:
  - name: default
    family: decoding_baseline
    strategy: identity

  - name: temp_1.0
    family: decoding_baseline
    strategy: identity
    decoding_overrides: {temperature: 1.0}

  - name: temp_1.3
    family: decoding_baseline
    strategy: identity
    decoding_overrides: {temperature: 1.3}

  - name: untruncated_t1.0
    family: decoding_baseline
    strategy: identity
    decoding_overrides: {temperature: 1.0, top_p: 1.0, top_k: 0}

  - name: minp_0.1_t1.5
    family: decoding_baseline
    strategy: identity
    decoding_overrides: {temperature: 1.5, top_p: 1.0, top_k: 0, min_p: 0.1}

split_file: data/narrative_split_v0_4.json
split: development
samples_per_prompt: 10
seed_replicates: 3
reference_samples: 10
seed: 20260917
partition_threshold: 0.80
judge_max_new_tokens: 96
judge_batch_size: 1
judge_rubric: scope_four_part_v0_4
rke_bandwidth: 0.5
results_path: results/v0_5_decoding.jsonl
notes: "v0.5.0 decoding baselines (untruncated, min-p); agreed 2026-10-09."
