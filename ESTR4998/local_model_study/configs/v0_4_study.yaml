# v0 study protocol v0.4.0 -- 2026-09-28.
#
# Implements ESTR4998/INITIAL_RESEARCH_SCOPE.md. Changes from v0.3.0 (DESIGN.md
# section 13):
#   * prompt set: the scope's 10 primary-domain development prompts (short
#     narrative and imaginative generation; 8 NB-curated + 2 project-authored),
#     from data/narrative_split_v0_4.json. Its 4 transfer probes are loadable
#     as split `transfer_probe` but are NOT run here: the scope doc forbids them
#     from influencing any choice, so they are scored only after a shortlist of
#     patterns exists;
#   * naive baseline wording: "Generate a creative and unusual response."
#     (condition `naive_creative`, replacing `naive_diverse`);
#   * every sampling and stopping parameter is explicit; nothing is inherited
#     from the model's bundled generation_config.json;
#   * quality judge uses the scope's four parts (judge_rubric) and functional
#     diversity/novelty use NoveltyBench's v1.0 classifier (DESIGN.md section 15).
# Models, decoding values, token ceiling, seeds, replicates, reference sets and
# metrics are unchanged from v0.3.0.

protocol_version: v0.4.0

generator:
  # Development generator only (INITIAL_RESEARCH_SCOPE.md): transfer claims
  # need a stronger generator later.
  model_id: Qwen/Qwen2.5-1.5B-Instruct
  revision: 989aa7980e4cf806f80c7fef2b1adb7bc71aa306
  dtype: bfloat16

judge:
  model_id: HuggingFaceTB/SmolLM2-1.7B-Instruct
  revision: 31b70e2e869a7173562077fd711b654946d38674
  dtype: bfloat16

embedder:
  model_id: sentence-transformers/all-MiniLM-L6-v2
  revision: 1110a243fdf4706b3f48f1d95db1a4f5529b4d41
  dtype: float32

# NoveltyBench v1.0 functional-equivalence classifier (functional.py). Reads
# the first 128 DeBERTa tokens of each response; no licence on its model card.
functional_classifier:
  model_id: yimingzhang/deberta-v3-large-generation-similarity
  revision: 4e11444c12adf9837e58ae1e598472c45b1d3bd9
  dtype: float32
functional_tokenizer:
  model_id: microsoft/deberta-v3-large
  revision: 64a8c8eab3e352a784c658aef62be1662607476f
  dtype: float32

# Qwen2.5's recommended settings, all stated. The generator refuses to run if
# the model's bundled defaults set any other output-shaping parameter.
decoding:
  do_sample: true
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  repetition_penalty: 1.1
  eos_token_ids: [151645, 151643]  # <|im_end|>, <|endoftext|>
  max_new_tokens: 512              # a ceiling, not a target; identical in every arm

conditions:
  - name: default
    family: decoding_baseline
    strategy: identity

  - name: temp_1.0
    family: decoding_baseline
    strategy: identity
    decoding_overrides: {temperature: 1.0}

  - name: temp_1.3
    family: decoding_baseline
    strategy: identity
    decoding_overrides: {temperature: 1.3}

  - name: temp_0.5
    family: decoding_baseline
    strategy: identity
    decoding_overrides: {temperature: 0.5}

  - name: naive_creative
    family: prompt_baseline
    strategy: naive_creative

split_file: data/narrative_split_v0_4.json
split: development
samples_per_prompt: 10
seed_replicates: 3
reference_samples: 10
seed: 20260917
partition_threshold: 0.80
judge_max_new_tokens: 96
# What v0.4.0 ran with. Batched judging lets a score depend on its batch-mates
# (DESIGN.md section 16); new protocols use 1. Kept so this file reproduces
# the recorded run.
judge_batch_size: 8
judge_rubric: scope_four_part_v0_4   # relevance, coherence, constraints, effectiveness
results_path: results/v0_4_study.jsonl
notes: "v0.4.0 narrative-scope baselines; metrics are diagnostics, read the raw outputs."
